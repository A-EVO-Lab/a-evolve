[project]
name = "evo-harness"
version = "0.1.0"
description = "EVO-HARNESS: context-to-harness skill compilation for self-evolving agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "A-EVO Lab" },
]
keywords = [
    "agent-evolution",
    "self-improving-agents",
    "llm-agents",
    "skills",
    "benchmark",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/A-EVO-Lab/a-evolve"
Repository = "https://github.com/A-EVO-Lab/a-evolve"
Issues = "https://github.com/A-EVO-Lab/a-evolve/issues"

[project.scripts]
evo-harness-cl = "evo_harness.cl_bench:main"
evo-harness-swe = "evo_harness.swe_bench:main"
evo-harness-tau = "evo_harness.tau_bench:main"
evo-harness-terminal = "evo_harness.terminal_bench:main"
evo-harness-webarena = "evo_harness.webarena_infinity:main"

[project.optional-dependencies]
cl = [
    "boto3>=1.34",
]
swe = [
    "boto3>=1.34",
    "datasets>=4.5.0",
    "swebench>=3.0.0",
]
terminal = [
    "boto3>=1.34",
]
tau = [
    "boto3>=1.34",
    "litellm>=1.0.0",
]
webarena = [
    "boto3>=1.34",
    "browser-use[aws]>=0.5.0",
    "playwright>=1.50",
    "requests>=2.31",
]
all = [
    "boto3>=1.34",
    "browser-use[aws]>=0.5.0",
    "datasets>=4.5.0",
    "litellm>=1.0.0",
    "playwright>=1.50",
    "requests>=2.31",
    "swebench>=3.0.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_evolve", "evo_harness"]

[tool.hatch.build.targets.wheel.force-include]
"seed_skills" = "seed_skills"

[tool.hatch.build.targets.sdist]
include = [
    "/agent_evolve",
    "/evo_harness",
    "/figures",
    "/scripts",
    "/seed_skills",
    "/tools",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py311"
line-length = 100
