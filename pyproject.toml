[project]
name = "a-evolve"
version = "0.1.0"
description = "EVO-HARNESS: context-to-harness skill compilation for self-evolving agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "A-EVO Lab" },
]
keywords = [
    "agent-evolution",
    "self-improving-agents",
    "llm-agents",
    "skills",
    "benchmark",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/A-EVO-Lab/a-evolve"
Repository = "https://github.com/A-EVO-Lab/a-evolve"
Issues = "https://github.com/A-EVO-Lab/a-evolve/issues"

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.30",
]
openai = [
    "openai>=1.30",
]
bedrock = [
    "boto3>=1.34",
]
cl = [
    "boto3>=1.34",
    "datasets>=4.5.0",
    "numpy>=1.26",
    "requests>=2.31",
    "sentence-transformers>=3.0",
    "strands-agents>=0.1.0",
    "tqdm>=4.66",
]
swe = [
    "boto3>=1.34",
    "datasets>=4.5.0",
    "strands-agents>=0.1.0",
    "swebench>=3.0.0",
]
terminal = [
    "boto3>=1.34",
    "requests>=2.31",
    "strands-agents>=0.1.0",
]
mcp = [
    "boto3>=1.34",
    "datasets>=4.5.0",
    "mcp>=1.0.0",
    "strands-agents>=0.1.0",
]
tau = [
    "boto3>=1.34",
    "litellm>=1.0.0",
]
webarena = [
    "boto3>=1.34",
    "browser-use[aws]>=0.5.0",
    "playwright>=1.50",
]
all = [
    "anthropic>=0.30",
    "boto3>=1.34",
    "browser-use[aws]>=0.5.0",
    "datasets>=4.5.0",
    "litellm>=1.0.0",
    "mcp>=1.0.0",
    "numpy>=1.26",
    "openai>=1.30",
    "playwright>=1.50",
    "requests>=2.31",
    "sentence-transformers>=3.0",
    "strands-agents>=0.1.0",
    "swebench>=3.0.0",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_evolve"]

[tool.hatch.build.targets.wheel.force-include]
"seed_workspaces" = "seed_workspaces"

[tool.hatch.build.targets.sdist]
include = [
    "/agent_evolve",
    "/examples",
    "/scripts",
    "/seed_workspaces",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py311"
line-length = 100
