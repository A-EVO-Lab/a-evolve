# FutureX V3 — structured_evolution template (4-phase: analyze → research → build → verify).
batch_size: 20
max_cycles: 0
holdout_ratio: 0.0
evolve_prompts: true
evolve_skills: true
evolve_memory: true
evolve_tools: true
evolver_model: <evolver-model-id>
evolver_max_tokens: 128000
egl_threshold: 0.05
egl_window: 3
model_name: <solver-model-id>
sort_by_timestamp: true
builtin_search: "off"
sandbox_network: bridge
evolver_sandbox_network: bridge
orchestrator: structured_evolution
structured_evolution:
  prompts_dir: experiments/futurex/evolver_prompts
  research_parallel: 3
  build_verify_retries: 3
  hitl_enabled: false
