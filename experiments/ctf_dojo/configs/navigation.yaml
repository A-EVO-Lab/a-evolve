batch_size: 5
max_cycles: 0
holdout_ratio: 0.0

evolve_prompts: true
evolve_skills: true
evolve_memory: true
evolve_tools: true

evolver_model: <evolver-model-id>
evolver_max_tokens: 128000

solve_workers: 8

egl_threshold: 0.05
egl_window: 3

# Navigation: plan-driven orchestration with strategy tree
navigation_enabled: true
branch_confidence_threshold: 0.7
orchestrator: plan_driven
