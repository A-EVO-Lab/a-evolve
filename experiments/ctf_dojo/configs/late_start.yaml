batch_size: 5
max_cycles: 0
holdout_ratio: 0.0

evolve_prompts: true
evolve_skills: true
evolve_memory: true
evolve_tools: true

evolver_model: <evolver-model-id>
evolver_max_tokens: 128000

solve_workers: 8

egl_threshold: 0.05
egl_window: 3

# Skip evolution for first 60% of tasks, then evolve for the rest.
# max_cycles is computed dynamically, evo_start_cycle computed from total_tasks
evo_start_after_pct: 60