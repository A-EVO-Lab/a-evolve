# PolyBench — structured_navigation template (4-phase + git branching).
batch_size: 100
max_cycles: 0
holdout_ratio: 0.0
evolve_prompts: true
evolve_skills: true
evolve_memory: false   # OFF: memory was accreting ~30k of unbounded single-market
                       # "learnings" never loaded usefully; skips solver-load + evolver-write
evolve_tools: true
evolver_model: us.anthropic.claude-opus-4-6-v1
evolver_max_tokens: 128000
solve_workers: 24
egl_threshold: 0.05
egl_window: 3
sandbox_network: none
evolver_sandbox_network: none
navigation_enabled: true
branch_confidence: 0.7
orchestrator: structured_navigation
structured_evolution:
  prompts_dir: experiments/polybench/evolver_prompts_nav
  research_parallel: 3
  build_verify_retries: 3
  hitl_enabled: false
