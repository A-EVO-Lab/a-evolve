# PolyBench — structured_evolution template (4-phase: analyze → research → build → verify).
batch_size: 100
max_cycles: 0
holdout_ratio: 0.0
evolve_prompts: true
evolve_skills: true
evolve_memory: true
evolve_tools: true
evolver_model: <evolver-model-id>
evolver_max_tokens: 128000
solve_workers: 24
egl_threshold: 0.05
egl_window: 3
sandbox_network: none
evolver_sandbox_network: none
orchestrator: structured_evolution
structured_evolution:
  prompts_dir: experiments/polybench/evolver_prompts
  research_parallel: 3
  build_verify_retries: 3
  hitl_enabled: false
