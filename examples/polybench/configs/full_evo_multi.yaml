# PolyBench full evolution with plan-driven multi-agent orchestration
# (no task routing — the analyst classifies batch failures and guides
# the evolver, but every task still flows through main).
batch_size: 100
max_cycles: 0
holdout_ratio: 0.0

evolve_prompts: true
evolve_skills: true
evolve_memory: true
evolve_tools: true

evolver_model: <evolver-model-id>
evolver_max_tokens: 128000

solve_workers: 24

egl_threshold: 0.05
egl_window: 3

# Multi-agent orchestration (no navigation)
orchestrator: plan_driven
